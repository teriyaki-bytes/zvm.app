<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">ZVM 8.12</title>
  <desc id="description">A large black 8.12 on white architectural drawing paper, with a fine square grid, construction lines, dimension arrows, and a technical title block.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
